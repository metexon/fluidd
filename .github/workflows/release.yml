name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  build:
    name: Build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read

  publish-docker:
    name: Publish
    needs: build
    uses: ./.github/workflows/_publish-docker.yml
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
      artifact-metadata: write

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download fluidd dist
        uses: actions/download-artifact@v8
        with:
          name: fluidd-${{ github.sha }}
          path: ./dist


      - name: Create Moonraker release info
        run: |
          cat > ./dist/release_info.json <<EOF
          {
            "project_name": "${{ github.event.repository.name }}",
            "project_owner": "${{ github.repository_owner }}",
            "version": "${{ github.ref_name }}",
            "asset_name": "fluidd.zip"
          }
          EOF

      - name: Create Artifact
        run: |
          cd ./dist
          zip -r ../fluidd.zip ./

      - name: Attest fluidd.zip
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./fluidd.zip

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./fluidd.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  publish-web:
    name: Deploy to Host
    needs: build
    if: ${{ github.repository == 'fluidd-core/fluidd' }}
    uses: ./.github/workflows/_publish-web.yml
    secrets:
      bucket: ${{ secrets.S3_BUCKET_NAME }}
      distribution-id: ${{ secrets.CF_DISTRIBUTION_ID }}
      aws-role: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
    permissions:
      id-token: write
      contents: read
